<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f9d5a"/>
      <stop offset="1" stop-color="#127a43"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f5ee"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- monitor / screen -->
  <rect x="108" y="118" width="296" height="212" rx="26" fill="url(#screen)"/>
  <!-- inner bezel line -->
  <rect x="108" y="118" width="296" height="212" rx="26" fill="none" stroke="#0f6636" stroke-opacity="0.12" stroke-width="6"/>

  <!-- stand -->
  <rect x="238" y="330" width="36" height="40" fill="#0e6a3a"/>
  <rect x="188" y="366" width="136" height="26" rx="13" fill="#0e6a3a"/>

  <!-- location pin (the "ponto") on the screen -->
  <g>
    <path d="M256 152
             c-46 0 -83 36 -83 81
             c0 58 83 121 83 121
             c0 0 83 -63 83 -121
             c0 -45 -37 -81 -83 -81 z"
          fill="#1f9d5a"/>
    <circle cx="256" cy="233" r="30" fill="#ffffff"/>
  </g>
</svg>
