name: Deploy para o VPS

on:
  push:
    branches: [ master ]      # troque para "master" se sua branch principal for master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar no VPS e atualizar
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/dooh-cms
            # Sem estas variáveis o app novo não sobe e a senha antiga já não existe: aborta antes de mexer em qualquer coisa.
            for v in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI ADMIN_EMAIL TOTP_ENCRYPTION_KEY; do grep -q "^$v=." .env || { echo "falta $v no .env"; exit 1; }; done
            echo ">> Puxando código novo..."
            git fetch --all
            git reset --hard origin/master
            # Conversão dos vídeos enviados pra 1080p (lib/video.js).
            command -v ffmpeg > /dev/null || { apt-get update && apt-get install -y ffmpeg; }
            echo ">> Instalando dependências (se mudaram)..."
            npm install --omit=dev
            echo ">> Buildando o frontend (admin + player)..."
            cd frontend && npm install && npm run build && cd ..
            echo ">> Reiniciando o app..."
            pm2 restart dooh
            echo ">> Conferindo se o app subiu..."
            sleep 3
            curl -fsS http://localhost:${PORT:-3000}/api/me > /dev/null
            echo ">> Deploy concluído com sucesso."




  