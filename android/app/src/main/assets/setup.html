<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PontoTela</title>
<!--
  Tela de configuracao do app da TV. Roda local (file:///android_asset), sem internet.
  Cores e fonte iguais as do site (public/site/styles.css).
  JS em ES5 de proposito: WebView de TV barata pode ser antigo (mesmo motivo do player.js).
  Navegacao pelas setas feita aqui mesmo: nem todo WebView move o foco com o D-pad.
-->
<style>
  @font-face {
    font-family: 'Archivo';
    src: url(archivo.woff2) format('woff2');
    font-weight: 400 900;
    font-stretch: 62% 125%;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  html { background: #101511; }
  body {
    background:
      radial-gradient(90% 80% at 85% 10%, rgba(31,157,90,.22), transparent 60%),
      radial-gradient(70% 60% at 0% 100%, rgba(233,98,43,.12), transparent 60%),
      #101511;
    color: #f6f4ee;
    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    font-size: 2.2vh;
    -webkit-font-smoothing: antialiased;
    cursor: none;
  }
  .page {
    height: 100%;
    padding: 8vh 7vw;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: space-between; justify-content: space-between;
  }

  /* ---------- coluna da esquerda ---------- */
  .copy { width: 46%; }
  .brand { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-bottom: 9vh; }
  .brand svg { width: 6.4vh; height: 6.4vh; margin-right: 1.4vh; border-radius: 1.4vh; }
  .brand-name {
    font-size: 4.2vh; font-weight: 800; letter-spacing: -.02em;
    font-variation-settings: 'wdth' 76; font-stretch: 76%;
  }
  .brand-name span { color: #1f9d5a; }
  .eyebrow {
    display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
    color: #f0a03c; font-weight: 700; font-size: 1.8vh; letter-spacing: .16em;
    text-transform: uppercase; margin-bottom: 2.6vh;
  }
  .eyebrow i { width: 1vh; height: 1vh; border-radius: 50%; background: currentColor; margin-right: 1.2vh; }
  h1 {
    margin: 0 0 3vh; font-size: 8.4vh; line-height: 1.02; font-weight: 800; letter-spacing: -.022em;
    font-variation-settings: 'wdth' 78; font-stretch: 78%;
  }
  h1 em { font-style: normal; color: #1f9d5a; }
  .lead { margin: 0; font-size: 2.8vh; line-height: 1.45; color: #a9b6ab; max-width: 30em; }
  .lead b { color: #f6f4ee; font-weight: 700; }
  .help {
    margin-top: 8vh; font-size: 1.9vh; color: #a9b6ab;
    display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
  }
  .kbd {
    display: inline-block; min-width: 3.4vh; padding: .4vh 1vh; margin-right: .8vh;
    border: 1px solid #2f3b31; border-bottom-width: 3px; border-radius: .6vh;
    color: #f6f4ee; font-weight: 700; text-align: center;
  }
  .help .sep { width: 3vh; }

  /* ---------- coluna da direita ---------- */
  .card {
    width: 44%;
    background: rgba(26,35,28,.85);
    border: 1px solid #2f3b31; border-radius: 2vh;
    padding: 4.4vh 4vh 4vh;
    box-shadow: 0 3vh 8vh rgba(0,0,0,.35);
  }
  .label { font-size: 1.8vh; letter-spacing: .14em; text-transform: uppercase; color: #a9b6ab; font-weight: 700; }
  .code {
    margin: 1.6vh 0 .6vh; height: 13vh;
    border-bottom: .5vh solid #1f9d5a;
    display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    font-size: 11vh; font-weight: 800; letter-spacing: .04em;
    font-variation-settings: 'wdth' 68; font-stretch: 68%;
  }
  .code.empty { color: #3e4b40; }
  .caret { width: .6vh; height: 9vh; margin-left: .8vh; background: #1f9d5a; -webkit-animation: blink 1s steps(1) infinite; animation: blink 1s steps(1) infinite; }
  @-webkit-keyframes blink { 50% { opacity: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  .error { height: 3.4vh; margin: 0 0 1.4vh; color: #ff8a6b; font-size: 2.1vh; font-weight: 600; text-align: center; }
  .shake { -webkit-animation: shake .35s; animation: shake .35s; }
  @-webkit-keyframes shake { 25% { -webkit-transform: translateX(-1.2vh); } 75% { -webkit-transform: translateX(1.2vh); } }
  @keyframes shake { 25% { transform: translateX(-1.2vh); } 75% { transform: translateX(1.2vh); } }

  .pad { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: 0 -.7vh; }
  .pad button {
    width: calc(33.333% - 1.4vh); margin: .7vh; height: 8.6vh;
    border: 1px solid #2f3b31; border-radius: 1.2vh;
    background: #101511; color: #f6f4ee;
    font-family: inherit; font-size: 4.4vh; font-weight: 700;
    font-variation-settings: 'wdth' 82; font-stretch: 82%;
    outline: none;
    -webkit-transition: -webkit-transform .12s, background .12s; transition: transform .12s, background .12s;
  }
  .pad .del { font-size: 2.4vh; color: #a9b6ab; }
  .pad .go {
    width: calc(100% - 1.4vh); height: 9.4vh; margin-top: 1.6vh;
    background: #e9622b; border-color: #e9622b; color: #fff8f2;
    font-size: 3.4vh; box-shadow: 0 .4vh 0 #b74716;
  }
  .pad .tv {
    width: calc(100% - 1.4vh); height: 6vh; margin-top: 1.2vh;
    background: transparent; border-color: transparent; color: #a9b6ab;
    font-size: 2.1vh; font-weight: 600;
  }
  .pad .tv:focus { background: #2a352c; border-color: #a9b6ab; color: #f6f4ee; -webkit-transform: none; transform: none; }
  /* Foco bem visivel: na TV e o unico "cursor" que existe. */
  .pad button:focus { background: #1f9d5a; border-color: #6fe0a1; color: #fff; -webkit-transform: scale(1.06); transform: scale(1.06); }
  .pad .go:focus { background: #f0703b; border-color: #fff8f2; -webkit-transform: scale(1.03); transform: scale(1.03); }
</style>
</head>
<body>
<div class="page">
  <section class="copy">
    <div class="brand">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#1f9d5a"/>
        <rect x="108" y="118" width="296" height="212" rx="26" fill="#fff"/>
        <rect x="238" y="330" width="36" height="40" fill="#0e6a3a"/>
        <rect x="188" y="366" width="136" height="26" rx="13" fill="#0e6a3a"/>
        <path d="M256 152c-46 0-83 36-83 81 0 58 83 121 83 121s83-63 83-121c0-45-37-81-83-81z" fill="#1f9d5a"/>
        <circle cx="256" cy="233" r="30" fill="#fff"/>
      </svg>
      <div class="brand-name">Ponto<span>Tela</span></div>
    </div>
    <div class="eyebrow"><i></i>Configurar esta TV</div>
    <h1>Qual é o código<br><em>desta tela?</em></h1>
    <p class="lead">É o número que aparece no painel, em <b>Telas</b>, ao lado do nome do ponto.</p>
    <div class="help">
      <span class="kbd">&#8592;</span><span class="kbd">&#8594;</span><span class="kbd">&#8593;</span><span class="kbd">&#8595;</span>&nbsp;navega
      <span class="sep"></span>
      <span class="kbd">OK</span>&nbsp;confirma
      <span class="sep"></span>
      <span class="kbd">0–9</span>&nbsp;números do controle
    </div>
  </section>

  <section class="card">
    <div class="label">Código da tela</div>
    <div id="code" class="code empty"></div>
    <div id="error" class="error"></div>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del" class="del">APAGAR</button><button data-k="0">0</button><button data-k="clr" class="del">LIMPAR</button>
      <button data-k="go" class="go">Começar &#8594;</button>
      <button data-k="tv" class="tv">Configurações da TV</button>
    </div>
  </section>
</div>

<script>
(function () {
  var MAX = 9;
  var COLS = 3;
  var codeEl = document.getElementById('code');
  var errEl = document.getElementById('error');
  var buttons = document.getElementById('pad').getElementsByTagName('button');
  var m = location.search.match(/[?&]code=(\d+)/);
  var code = m ? m[1] : '';

  function render() {
    codeEl.className = code ? 'code' : 'code empty';
    codeEl.innerHTML = code + '<span class="caret"></span>';
  }

  function fail(text) {
    errEl.textContent = text;
    codeEl.className += ' shake';
    setTimeout(render, 400);
  }

  function press(k) {
    errEl.textContent = '';
    if (k === 'del') code = code.slice(0, -1);
    else if (k === 'clr') code = '';
    else if (k === 'go') return submit();
    else if (k === 'tv') { if (window.PontoTela) window.PontoTela.openTvSettings(); return; }
    else if (code.length < MAX) code += k;
    render();
  }

  function submit() {
    if (!/^\d+$/.test(code)) return fail('Digite o código antes de começar.');
    if (window.PontoTela) window.PontoTela.save(code);
  }

  function indexOf(el) {
    for (var i = 0; i < buttons.length; i++) if (buttons[i] === el) return i;
    return -1;
  }

  // Grade 3x4 (0-11), depois "Comecar" (12) e "Configuracoes da TV" (13), cada um numa linha.
  var GO = 12, TV = 13;
  function move(i, key) {
    if (i === -1) return 0;
    if (i === TV) return key === 'up' ? GO : i;
    if (i === GO) return key === 'up' ? 10 : key === 'down' ? TV : i;
    if (key === 'left') return i % COLS ? i - 1 : i;
    if (key === 'right') return i % COLS < COLS - 1 ? i + 1 : i;
    if (key === 'up') return i - COLS >= 0 ? i - COLS : i;
    if (key === 'down') return i + COLS < GO ? i + COLS : GO;
    return i;
  }

  var ARROWS = { 37: 'left', 38: 'up', 39: 'right', 40: 'down' };

  document.addEventListener('keydown', function (e) {
    var kc = e.keyCode;
    if (ARROWS[kc]) {
      e.preventDefault();
      buttons[move(indexOf(document.activeElement), ARROWS[kc])].focus();
    } else if (kc >= 48 && kc <= 57) {
      press(String(kc - 48));
    } else if (kc >= 96 && kc <= 105) {
      press(String(kc - 96));
    } else if (kc === 8 || kc === 46) {
      e.preventDefault();
      press('del');
    } else if (kc === 13 && indexOf(document.activeElement) === -1) {
      submit();
    }
  }, false);

  for (var i = 0; i < buttons.length; i++) {
    buttons[i].onclick = function () { press(this.getAttribute('data-k')); };
  }

  render();
  // Ja tem codigo (veio do botao VOLTAR): foco no "Comecar" pra confirmar com um OK so.
  buttons[code ? GO : 0].focus();
})();
</script>
</body>
</html>
