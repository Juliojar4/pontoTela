<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage img,#stage video{width:100%;height:100%;object-fit:contain;background:#000}
  #msg{color:#555;font-size:22px;text-align:center}
</style>
</head>
<body>
<div id="stage"><div id="msg">Carregando…</div></div>
<script>
const params = new URLSearchParams(location.search);
const screenId = params.get('screen');
const stage = document.getElementById('stage');
let items = [], idx = 0;

const cacheKey = () => 'playlist_' + screenId;
function saveCache(d){ try{ localStorage.setItem(cacheKey(), JSON.stringify(d)); }catch(e){} }
function loadCache(){ try{ return JSON.parse(localStorage.getItem(cacheKey())); }catch(e){ return null; } }

async function fetchPlaylist(){
  try{
    const r = await fetch('/api/play/' + screenId, { cache: 'no-store' });
    const d = await r.json();
    if (d.items && d.items.length){ items = d.items; saveCache(d); }
  }catch(e){
    const c = loadCache();           // sem internet? usa a ultima playlist salva
    if (c && c.items) items = c.items;
  }
}

function impression(it){
  const payload = JSON.stringify({ screenId, mediaId: it.mediaId });
  try{ navigator.sendBeacon('/api/impression', new Blob([payload], { type: 'application/json' })); }
  catch(e){ fetch('/api/impression', { method:'POST', headers:{'Content-Type':'application/json'}, body: payload }).catch(()=>{}); }
}

function playNext(){
  if (!items.length){ stage.innerHTML = '<div id="msg">Sem conteúdo programado</div>'; setTimeout(playNext, 5000); return; }
  const it = items[idx % items.length]; idx++;
  impression(it);
  stage.innerHTML = '';
  if (it.type === 'video'){
    const v = document.createElement('video');
    v.src = it.url; v.autoplay = true; v.muted = true; v.playsInline = true;
    v.onended = playNext;
    v.onerror = () => setTimeout(playNext, 500);
    stage.appendChild(v);
    v.play().catch(()=>{});
  } else {
    const img = document.createElement('img');
    img.src = it.url;
    img.onerror = () => setTimeout(playNext, 500);
    stage.appendChild(img);
    setTimeout(playNext, (it.duration || 10) * 1000);
  }
}

async function start(){
  if (!screenId){ stage.innerHTML = '<div id="msg">Falta ?screen=ID na URL</div>'; return; }
  if ('serviceWorker' in navigator){ try{ await navigator.serviceWorker.register('/sw.js'); }catch(e){} }
  await fetchPlaylist();
  playNext();
  setInterval(fetchPlaylist, 5 * 60 * 1000); // busca atualizacoes a cada 5 min
}
start();
</script>
</body>
</html>
