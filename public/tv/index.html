<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
      body { cursor: none; }
      #stage { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
      .layer {
        position: absolute; top: 0; right: 0; bottom: 0; left: 0;
        opacity: 0;
        -webkit-transition: opacity 700ms ease;
        transition: opacity 700ms ease;
      }
      .layer.active { opacity: 1; }
      .layer img, .layer video {
        position: absolute; top: 0; right: 0; bottom: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: contain;
        background: #000;
      }
      /* display:table + table-cell centraliza vertical em qualquer WebView, ate os sem flexbox */
      #msg {
        position: fixed; top: 0; right: 0; bottom: 0; left: 0;
        display: none;
        width: 100%; height: 100%;
        text-align: center; color: #555; background: #000;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 22px;
      }
      #msg.on { display: table; }
      #msg span { display: table-cell; vertical-align: middle; }
      /* Faixa de diagnostico (?debug=1): fica por cima sem esconder o conteudo. */
      #diag {
        position: fixed; top: 0; right: 0; left: 0; z-index: 9999;
        display: none; max-height: 45%; overflow: auto;
        padding: 12px 16px; background: rgba(0, 0, 0, 0.75); color: #ccc;
        font: 13px/1.45 monospace; word-wrap: break-word;
      }
      #diag .err { color: #ff7a7a; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="msg" class="on"><span>Carregando&hellip;</span></div>
    <div id="diag"></div>
    <script src="/tv/player.js?v=1"></script>
  </body>
</html>
